[project]
name = "tender-status-service"
version = "0.1.0"
description = "Микросервис трекинга статусов тендеров"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Тестовые зависимости объявлены дополнением, а не группой Poetry: группы
# понимает только Poetry, а дополнение ставится и им, и pip.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Каталог пакета указан дважды: PEP 621 не описывает, где искать исходники,
# и setuptools с Poetry спрашивают это каждый по-своему.
[tool.setuptools]
packages = ["app"]

[tool.poetry]
packages = [{ include = "app" }]
